# E1 on a window of two flight lines (images 40-120, 37 keyframes): a
# quick check of the run procedure and of changes, not a thesis result.

[run]
name = "e1_window"
id_prefix = "e1w"      # run identifier: <id_prefix>_<MMDDhhmmss>_<repetition>, at most 19 characters
repetitions = 1
output = "/home/ahmet/MasterProgramm/test_outputs/runs"
settle_s = 20
max_wait_s = 400
keep_products = ["dsm", "ortho"]
reference_dsm = "/home/ahmet/navigation-project-stack/Dorsberck2/DSM_Dorfberg_20201109_10cm.tif"

[injector]
poses = "data/processed/dorfberg_f01/poses_optimized.txt"
captures = "data/processed/dorfberg_f01/captures.txt"
images = "/home/ahmet/navigation-project-stack/Dorsberck2"
first = 40
count = 80
time_factor = 1.0
telemetry_rate = 10
